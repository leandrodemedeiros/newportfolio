<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{{ $title := cond .IsHome .Site.Title (printf "%s · %s" .Title .Site.Params.author) }}
<title>{{ $title }}</title>
{{ $desc := or .Params.summary .Params.description .Site.Params.description }}
<meta name="description" content="{{ $desc | plainify }}">
<meta property="og:title" content="{{ $title }}">
<meta property="og:description" content="{{ $desc | plainify }}">
<meta property="og:type" content="{{ cond .IsHome "website" "article" }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:image" content="{{ .Site.Params.photo | absURL }}">
<link rel="canonical" href="{{ .Permalink }}">
{{ range .AllTranslations }}<link rel="alternate" hreflang="{{ .Language.LanguageCode }}" href="{{ .Permalink }}">
{{ end }}
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ "css/site.css" | relURL }}">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%2313233A'/><path d='M9 7v18h14' stroke='%236CC3A3' stroke-width='3' fill='none'/></svg>">
